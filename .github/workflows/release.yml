name: Release

# A tag v<version> (the version of launcher/src-tauri/tauri.conf.json) builds the downloadable package with
# scripts/package-release.ps1 and attaches VIctory-S-<version>.zip to the GitHub Release of that tag
# (created as a pre-release if it does not exist yet).
# Since 0.2 it stops at its first step with an explanation: the package includes dlssg-to-fsr3, built from source
# locally (scripts/release/fg-README.txt), so releases are packaged on the maintainer's PC and attached by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Since 0.2 the package carries dlssg-to-fsr3 (fg\, frame generation on RTX 20/30 and GTX 16), built from
      # source at commit 0e253f63 with Visual Studio, vcpkg, the Vulkan SDK and the FidelityFX SDK's two backends
      # (scripts/release/fg-README.txt). That build is not done here yet: the release is packaged locally
      # (scripts\package-release.ps1 -Fsr3Build <the build>) and its zip attached to the release by hand. Stop at
      # once and say so, rather than publish a package without frame generation or fail later with a vaguer error.
      - name: dlssg-to-fsr3 (fg\) is built locally
        shell: pwsh
        run: |
          Write-Output "::error title=Package locally::Since 0.2 the package includes dlssg-to-fsr3 (fg\), built from source (scripts/release/fg-README.txt); CI does not build it. Package locally: powershell -ExecutionPolicy Bypass -File scripts\package-release.ps1 -Fsr3Build <dlssg-to-fsr3 build>, then attach dist\VIctory-S-<version>.zip to the release by hand."
          exit 1
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            launcher/src-tauri -> target
      # CI has already tested the tagged commit; the asset policy once more, then the package: engine and launcher
      # built for any x86-64 processor with AVX2, assembled, checked (no game file, no DLL, nothing over 50 MB but
      # victory.exe) and zipped.
      - name: Asset policy
        run: cargo xtask policy
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.ps1 -Version $env:TAG.TrimStart('v')
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VIctory-S-*.zip
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
