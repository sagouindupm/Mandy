<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="VIctory S: the Series S profile for low-end PCs">
  <!-- VIctory S banner, drawn for this repository (GPL-3.0-or-later). The mark is the launcher's logo, the
       sagouin mascot (launcher/src/assets/sagouin.svg, inlined below); the line is the sunset of the game
       window's title bar. -->
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3C78"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3C78" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF3C78" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="1" r="0.5">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF3C78" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" fill="#141120"/>
  <rect y="180" width="1280" height="140" fill="url(#glow)"/>
  <ellipse cx="1040" cy="300" rx="300" ry="170" fill="url(#sun)"/>
  <!-- horizon lines -->
  <g stroke="#FF3C78" stroke-opacity="0.18" stroke-width="2">
