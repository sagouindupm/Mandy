<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="VIctory S : le profil Series S pour les petites configurations">
  <!-- VIctory S banner, drawn for this repository (GPL-3.0-or-later). The mark is the launcher's logo
       (launcher/src/components/logo.tsx); the line is the sunset of the game window's title bar. -->
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3C78"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3C78" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF3C78" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="1" r="0.5">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF3C78" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" fill="#141120"/>
  <rect y="180" width="1280" height="140" fill="url(#glow)"/>
  <ellipse cx="1040" cy="300" rx="300" ry="170" fill="url(#sun)"/>
  <!-- horizon lines -->
  <g stroke="#FF3C78" stroke-opacity="0.18" stroke-width="2">
    <line x1="760" y1="262" x2="1280" y2="262"/>
    <line x1="820" y1="280" x2="1280" y2="280"/>
    <line x1="880" y1="296" x2="1280" y2="296"/>
  </g>
  <!-- the mark -->
  <g transform="translate(96 88) scale(2.25)">
    <rect width="64" height="64" rx="14" fill="#FF3C78"/>
    <path d="M39.79 18.5 A9 9 0 1 0 32 32 A9 9 0 1 1 24.21 45.5" fill="none" stroke="#0B0B10" stroke-width="8"/>
  </g>
  <!-- the wordmark -->
  <text x="276" y="178" fill="#FFFFFF" font-family="'Josefin Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="10">VIctory S</text>
  <rect x="280" y="204" width="520" height="8" rx="4" fill="url(#sunset)"/>
  <text x="280" y="250" fill="#C9C3D9" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="1">Le profil Series S pour les petites configurations</text>
</svg>
