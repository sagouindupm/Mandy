[package]
name = "sagouindupm-launcher"
version = "0.3.1"
description = "Sagouindupm | VIctory : lanceur graphique (profil Series S)"
authors = ["sagouindupm"]
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

# Its own workspace: the launcher is not part of the engine's workspace (CI and `cargo build -p victory`
# never build it).
[workspace]

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (cargo issue 8519 on Windows).
name = "sagouindupm_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Renders the app icon from the mascot's SVG drawings (build.rs). resvg re-exports the usvg and tiny-skia it
# was built with (resvg::usvg, resvg::tiny_skia), so they need no entry of their own. Default features off: the
# drawings hold no text or raster image, so no font database or image decoders.
resvg = { version = "0.45", default-features = false }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
