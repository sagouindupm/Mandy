<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Sagouin (common marmoset, Callithrix jacchus), the Sagouindupm mascot. Original drawing for this
       repository (GPL-3.0-or-later), on the launcher's sunset-pink rounded square (corner radius 22 %).
       Detailed variant, for 32 px and up (48 px and up in the app icon); sagouin-small.svg below that.
       Used by src/components/logo.tsx and src-tauri/build.rs (app icon). docs/assets/sagouin.svg is a copy
       for the README, and docs/assets/banniere.svg inlines
       these shapes: keep all three in step. Flat colours, no gradient, no text, no stroke under 1.5 at 64 px. -->
  <rect width="64" height="64" rx="14" fill="#FF3C78"/>
  <!-- the ringed tail, from behind the head, round under the chin, curling up on the left -->
  <path d="M41 40 C52 46 52 55 42 57.5 C34 59.5 22 59.5 15 55.5 C9 52 10 45.5 16 45.5" fill="none" stroke="#0B0B10" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M41 40 C52 46 52 55 42 57.5 C34 59.5 22 59.5 15 55.5 C9 52 10 45.5 16 45.5" fill="none" stroke="#F5F1EA" stroke-width="4.5" stroke-dasharray="1.8 3"/>
  <!-- the white ear tufts, three locks fanning out on each side, with the ear at their root -->
  <g>
    <path d="M24 18.2 C17 14.5 12 12 6.5 11 C9 14 10.5 17 12 19.5 C8 20.5 4.5 23.5 2.5 27.5 C6 28 9 29 11.5 30.5 C8.5 33.5 6 37.5 5 42 C10.5 40.5 16 38.5 21.5 37 Z" fill="#F5F1EA"/>
    <path d="M22.8 21.5 C19.5 22.2 17 24.6 16 28 C17.8 30.2 20.2 31.6 22.5 32 Z" fill="#6E5B4E"/>
  </g>
  <g transform="matrix(-1 0 0 1 64 0)">
    <path d="M24 18.2 C17 14.5 12 12 6.5 11 C9 14 10.5 17 12 19.5 C8 20.5 4.5 23.5 2.5 27.5 C6 28 9 29 11.5 30.5 C8.5 33.5 6 37.5 5 42 C10.5 40.5 16 38.5 21.5 37 Z" fill="#F5F1EA"/>
    <path d="M22.8 21.5 C19.5 22.2 17 24.6 16 28 C17.8 30.2 20.2 31.6 22.5 32 Z" fill="#6E5B4E"/>
  </g>
  <!-- the round head, its crown banded: charcoal, grey-brown, charcoal, near-black -->
  <ellipse cx="32" cy="30" rx="15" ry="14" fill="#2A2A2E"/>
  <path d="M18.93 27 A13.5 12 0 0 1 45.07 27" fill="none" stroke="#6E5B4E" stroke-width="2"/>
  <path d="M21.66 27 A11 8.8 0 0 1 42.34 27" fill="none" stroke="#0B0B10" stroke-width="1.6"/>
  <!-- the face -->
  <path d="M32 24 C36 23 41.5 23.5 43.5 28 C45 32.5 42.5 37.5 38.5 40.8 C36.5 42.6 34.4 43.4 32 43.4 C29.6 43.4 27.5 42.6 25.5 40.8 C21.5 37.5 19 32.5 20.5 28 C22.5 23.5 28 23 32 24 Z" fill="#6E5B4E"/>
  <!-- the pale forehead blaze -->
  <path d="M32 17 C35.6 19.5 35.8 24 32 29.5 C28.2 24 28.4 19.5 32 17 Z" fill="#F5F1EA"/>
  <!-- the big eyes, two highlights each -->
  <circle cx="26" cy="31.5" r="5" fill="#0B0B10"/>
  <circle cx="38" cy="31.5" r="5" fill="#0B0B10"/>
  <circle cx="27.7" cy="29.8" r="1.7" fill="#FFFFFF"/>
  <circle cx="39.7" cy="29.8" r="1.7" fill="#FFFFFF"/>
  <circle cx="24.4" cy="33.2" r="0.8" fill="#FFFFFF"/>
  <circle cx="36.4" cy="33.2" r="0.8" fill="#FFFFFF"/>
  <!-- nose and mouth -->
  <path d="M29.8 36.8 Q32 36 34.2 36.8 Q33.3 39 32 39.2 Q30.7 39 29.8 36.8 Z" fill="#0B0B10"/>
  <path d="M32 39.2 L32 41.3 M29.4 41.2 Q30.8 42.3 32 41.3 Q33.2 42.3 34.6 41.2" fill="none" stroke="#0B0B10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
